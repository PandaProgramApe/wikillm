# WikiLLM 配置文件

# LLM配置
llm:
  # 默认提供商: openai, ollama，deepseek
  provider: "ollama"
  
  # OpenAI配置
  openai:
    api_key: "${OPENAI_API_KEY}"  # 从环境变量读取
    model: "gpt-4o-mini"
    base_url: null  # 可选：自定义API端点
    
  # Ollama配置（本地模型）
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2:1.5b"
    
  # DeepSeek配置（OpenAI兼容API）
  deepseek:
    api_key: "${DEEPSEEK_API_KEY}"  # 从环境变量读取，或直接在yaml中填写
    model: "deepseek-v4-flash"            # V4旗舰模型; 可选: deepseek-v4-flash, deepseek-v4-pro
    base_url: "https://api.deepseek.com"  # DeepSeek官方端点
    
  # 通用参数
  temperature: 0.3
  max_tokens: 4096

# 文档处理配置
document:
  # 支持的格式
  supported_formats:
    - ".pdf"
    - ".docx"
    - ".doc"
    - ".md"
    - ".txt"
    - ".text"

  # 文本分块设置（增大 chunk_size 减少API调用次数）
  chunk_size: 4000
  chunk_overlap: 200

  # 并发分析线程数（同时调用多少个API）
  max_workers: 5

# Wiki构建配置
wiki:
  # 输出目录
  output_dir: "data/wiki"
  
  # Wiki结构
  structure:
    - "index.md"         # 首页/目录
    - "concepts/"        # 概念解释
    - "details/"         # 详细内容
    - "summaries/"       # 摘要汇总
    
  # 编译提示词模板
  prompts:
    analyze: |
      你是一个知识整理专家。请分析以下文档内容，提取关键信息：
      1. 核心概念和定义
      2. 主要论点和结论
      3. 重要细节和示例
      4. 章节结构和逻辑关系
      
      文档内容：
      {content}
      
      请以结构化的方式输出分析结果。
      
    compile: |
      你是一个Wiki编写专家。基于以下分析结果，编写一篇结构清晰、易于理解的Wiki文章：
      
      分析结果：
      {analysis}
      
      要求：
      1. 使用Markdown格式
      2. 结构清晰，包含标题、子标题
      3. 重要概念加粗
      4. 添加适当的链接和引用
      5. 语言简洁明了
      
      请直接输出Wiki文章内容。

# Web界面配置
web:
  host: "0.0.0.0"
  port: 5000
  debug: false
  
# 日志配置
logging:
  level: "INFO"
  file: "wikillm.log"
